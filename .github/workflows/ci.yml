name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Contrast and completeness
        run: python3 scripts/check_themes.py
      - name: Install YACE
        run: curl -fsSL https://abedmurrar.github.io/yace/install.sh | sudo sh
      - name: Package (validates the manifest and every theme)
        run: scripts/package.sh
      - name: Install the package
        run: yace --install-plugin dist/yace-themes-*.tar.gz --yes
