# Phosphor: a green phosphor monitor, green on black. Errors and deleted
# files stay red and warnings amber, so problems still stand out.
name = "Phosphor"
type = "dark"

[colors]
"editor.background" = "#000000"
"editor.foreground" = "#33ff33"
"descriptionForeground" = "#239a23"
"sideBar.background" = "#020a02"
"sideBar.foreground" = "#2fcc2f"
"sideBarTitle.foreground" = "#8cff8c"
"tab.activeBackground" = "#000000"
"tab.activeForeground" = "#8cff8c"
"tab.inactiveBackground" = "#020a02"
"tab.inactiveForeground" = "#239a23"
"editorGroupHeader.tabsBackground" = "#020a02"
"editorGroup.border" = "#0f5f0f"
"focusBorder" = "#33ff33"
"editor.selectionBackground" = "#0a350a"
"editor.inactiveSelectionBackground" = "#0a300a"
"editor.lineHighlightBackground" = "#062206"
"editorLineNumber.foreground" = "#1a6b1a"
"editorLineNumber.activeForeground" = "#8cff8c"
"editorCursor.background" = "#000000"
"editorCursor.foreground" = "#8cff8c"
"editorBracketMatch.background" = "#145c14"
"statusBar.background" = "#0a3a0a"
"statusBar.foreground" = "#8cff8c"
"statusBar.noFolderBackground" = "#1a1a00"
"list.activeSelectionBackground" = "#0a350a"
"list.activeSelectionForeground" = "#d4ffd4"
"list.inactiveSelectionBackground" = "#062206"
"list.highlightForeground" = "#d4ffd4"
"editorWidget.background" = "#020a02"
"editorWidget.foreground" = "#33ff33"
"editorWidget.border" = "#2fcc2f"
"quickInputList.focusBackground" = "#0a350a"
"input.background" = "#062206"
"editorError.foreground" = "#ff4d4d"
"editorWarning.foreground" = "#ffb000"
"editorInfo.foreground" = "#8cff8c"
"gitDecoration.modifiedResourceForeground" = "#ffb000"
"gitDecoration.addedResourceForeground" = "#8cff8c"
"gitDecoration.deletedResourceForeground" = "#ff4d4d"
"yace.dirtyForeground" = "#ffb000"
"yace.missingRootForeground" = "#ff4d4d"
"scrollbarSlider.background" = "#0f5f0f"
"editorWhitespace.foreground" = "#0f4a0f"
"editor.findMatchHighlightBackground" = "#145c14"
"editor.findMatchBackground" = "#1f8a1f"
"editorSuggestWidget.highlightForeground" = "#d4ffd4"
"terminal.background" = "#000000"
"terminal.foreground" = "#33ff33"
"terminal.ansiBlack" = "#0a300a"
"terminal.ansiRed" = "#ff4d4d"
"terminal.ansiGreen" = "#2fcc2f"
"terminal.ansiYellow" = "#ffb000"
"terminal.ansiBlue" = "#239a23"
"terminal.ansiMagenta" = "#2fcc2f"
"terminal.ansiCyan" = "#33ff33"
"terminal.ansiWhite" = "#33ff33"
"terminal.ansiBrightBlack" = "#1a6b1a"
"terminal.ansiBrightRed" = "#ff7070"
"terminal.ansiBrightGreen" = "#8cff8c"
"terminal.ansiBrightYellow" = "#ffc840"
"terminal.ansiBrightBlue" = "#2fcc2f"
"terminal.ansiBrightMagenta" = "#8cff8c"
"terminal.ansiBrightCyan" = "#8cff8c"
"terminal.ansiBrightWhite" = "#d4ffd4"

[syntax]
"none" = "#33ff33"
"comment" = { fg = "#239a23", italic = true }
"string" = "#8cff8c"
"string.special" = "#8cff8c"
"string.escape" = "#d4ffd4"
"character" = "#8cff8c"
"number" = "#d4ffd4"
"boolean" = "#d4ffd4"
"constant" = "#d4ffd4"
"constant.builtin" = "#d4ffd4"
"keyword" = { fg = "#d4ffd4", bold = true }
"keyword.control" = { fg = "#d4ffd4", bold = true }
"operator" = "#2fcc2f"
"punctuation" = "#2fcc2f"
"punctuation.bracket" = "#2fcc2f"
"function" = { fg = "#8cff8c", bold = true }
"function.builtin" = "#8cff8c"
"function.method" = "#8cff8c"
"function.macro" = "#d4ffd4"
"type" = "#8cff8c"
"type.builtin" = "#8cff8c"
"constructor" = "#8cff8c"
"variable" = "#33ff33"
"variable.builtin" = "#d4ffd4"
"variable.parameter" = "#33ff33"
"property" = "#33ff33"
"attribute" = "#2fcc2f"
"tag" = "#8cff8c"
"namespace" = "#2fcc2f"
"label" = "#2fcc2f"
"markup.heading" = { fg = "#d4ffd4", bold = true }
"markup.bold" = { fg = "#33ff33", bold = true }
"markup.italic" = { fg = "#33ff33", italic = true }
"markup.link" = { fg = "#8cff8c", underline = true }
"markup.raw" = "#8cff8c"
"markup.list" = "#d4ffd4"
"embedded" = "#33ff33"
