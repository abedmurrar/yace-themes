# Low Contrast: soft and muted for long sessions. No pure white and no
# saturated colours; text stays readable (4.5:1 to 7:1) and comments are at
# least 3:1.
name = "Low Contrast"
type = "dark"

[colors]
"editor.background" = "#2b2d31"
"editor.foreground" = "#a9adb5"
"descriptionForeground" = "#91969f"
"sideBar.background" = "#26282b"
"sideBar.foreground" = "#a9adb5"
"sideBarTitle.foreground" = "#91969f"
"tab.activeBackground" = "#2b2d31"
"tab.activeForeground" = "#a9adb5"
"tab.inactiveBackground" = "#26282b"
"tab.inactiveForeground" = "#91969f"
"editorGroupHeader.tabsBackground" = "#26282b"
"editorGroup.border" = "#3a3d43"
"focusBorder" = "#6f87a8"
"editor.selectionBackground" = "#353944"
"editor.inactiveSelectionBackground" = "#33363b"
"editor.lineHighlightBackground" = "#2f3135"
"editorLineNumber.foreground" = "#5d6168"
"editorLineNumber.activeForeground" = "#91969f"
"editorCursor.background" = "#2b2d31"
"editorCursor.foreground" = "#a9adb5"
"editorBracketMatch.background" = "#3a4248"
"statusBar.background" = "#26282b"
"statusBar.foreground" = "#91969f"
"statusBar.noFolderBackground" = "#32293a"
"list.activeSelectionBackground" = "#383d48"
"list.activeSelectionForeground" = "#a9adb5"
"list.inactiveSelectionBackground" = "#33363b"
"list.highlightForeground" = "#a7b4c9"
"editorWidget.background" = "#26282b"
"editorWidget.foreground" = "#a9adb5"
"editorWidget.border" = "#3a3d43"
"quickInputList.focusBackground" = "#383d48"
"input.background" = "#33363b"
"editorError.foreground" = "#c08a8a"
"editorWarning.foreground" = "#b8a57e"
"editorInfo.foreground" = "#8fa3bf"
"gitDecoration.modifiedResourceForeground" = "#b8a57e"
"gitDecoration.addedResourceForeground" = "#93ab8a"
"gitDecoration.deletedResourceForeground" = "#c08a8a"
"yace.dirtyForeground" = "#b8a57e"
"yace.missingRootForeground" = "#c08a8a"
"scrollbarSlider.background" = "#3a3d43"
"editorWhitespace.foreground" = "#3f4248"
"editor.findMatchHighlightBackground" = "#3f3d33"
"editor.findMatchBackground" = "#545037"
"editorSuggestWidget.highlightForeground" = "#a7b4c9"
"terminal.background" = "#26282b"
"terminal.foreground" = "#a9adb5"
"terminal.ansiBlack" = "#3a3d43"
"terminal.ansiRed" = "#c08a8a"
"terminal.ansiGreen" = "#93ab8a"
"terminal.ansiYellow" = "#b8a57e"
"terminal.ansiBlue" = "#8fa3bf"
"terminal.ansiMagenta" = "#ab95b8"
"terminal.ansiCyan" = "#8eb0ab"
"terminal.ansiWhite" = "#a9adb5"
"terminal.ansiBrightBlack" = "#81868f"
"terminal.ansiBrightRed" = "#cc9a9a"
"terminal.ansiBrightGreen" = "#a2b999"
"terminal.ansiBrightYellow" = "#c4b38e"
"terminal.ansiBrightBlue" = "#9fb1ca"
"terminal.ansiBrightMagenta" = "#b9a5c4"
"terminal.ansiBrightCyan" = "#9ebdb8"
"terminal.ansiBrightWhite" = "#c3c6cc"

[syntax]
"none" = "#a9adb5"
"comment" = { fg = "#81868f", italic = true }
"string" = "#9fb08f"
"string.special" = "#9fb08f"
"string.escape" = "#b8a57e"
"character" = "#9fb08f"
"number" = "#b9a08f"
"boolean" = "#b9a08f"
"constant" = "#b9a08f"
"constant.builtin" = "#b9a08f"
"keyword" = "#9aa6c4"
"keyword.control" = "#ab9ab8"
"operator" = "#91969f"
"punctuation" = "#91969f"
"punctuation.bracket" = "#91969f"
"function" = "#b8ac8c"
"function.builtin" = "#b8ac8c"
"function.method" = "#b8ac8c"
"function.macro" = "#8eb0ab"
"type" = "#8eb0ab"
"type.builtin" = "#8eb0ab"
"constructor" = "#8eb0ab"
"variable" = "#a9adb5"
"variable.builtin" = "#9aa6c4"
"variable.parameter" = "#b3aca3"
"property" = "#a3adb8"
"attribute" = "#ab9ab8"
"tag" = "#9aa6c4"
"namespace" = "#8eb0ab"
"label" = "#91969f"
"markup.heading" = { fg = "#9aa6c4", bold = true }
"markup.bold" = { fg = "#a9adb5", bold = true }
"markup.italic" = { fg = "#a9adb5", italic = true }
"markup.link" = { fg = "#8fa3bf", underline = true }
"markup.raw" = "#9fb08f"
"markup.list" = "#9aa6c4"
"embedded" = "#a9adb5"
