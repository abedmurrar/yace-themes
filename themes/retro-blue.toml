# Retro Blue: the blue-screen IDEs of the DOS years. Yellow and white text
# on blue, cyan bars and grey dialogs, in the 16-colour CGA palette (with a
# slightly lighter red, so errors are readable on blue).
name = "Retro Blue"
type = "dark"

[colors]
"editor.background" = "#0000aa"
"editor.foreground" = "#ffff55"
"descriptionForeground" = "#aaaaaa"
"sideBar.background" = "#0000aa"
"sideBar.foreground" = "#ffffff"
"sideBarTitle.foreground" = "#ffff55"
"tab.activeBackground" = "#0000aa"
"tab.activeForeground" = "#ffffff"
"tab.inactiveBackground" = "#000000"
"tab.inactiveForeground" = "#aaaaaa"
"editorGroupHeader.tabsBackground" = "#000000"
"editorGroup.border" = "#55ffff"
"focusBorder" = "#ffffff"
"editor.selectionBackground" = "#000000"
"editor.inactiveSelectionBackground" = "#555555"
"editor.lineHighlightBackground" = "#0000c4"
"editorLineNumber.foreground" = "#55ffff"
"editorLineNumber.activeForeground" = "#ffffff"
"editorCursor.background" = "#0000aa"
"editorCursor.foreground" = "#ffffff"
"editorBracketMatch.background" = "#aa00aa"
"statusBar.background" = "#00aaaa"
"statusBar.foreground" = "#000000"
"statusBar.noFolderBackground" = "#aaaaaa"
"list.activeSelectionBackground" = "#00aaaa"
"list.activeSelectionForeground" = "#000000"
"list.inactiveSelectionBackground" = "#555555"
"list.highlightForeground" = "#0000aa"
"editorWidget.background" = "#aaaaaa"
"editorWidget.foreground" = "#000000"
"editorWidget.border" = "#ffffff"
"quickInputList.focusBackground" = "#00aa00"
"input.background" = "#ffffff"
"editorError.foreground" = "#ff6b6b"
"editorWarning.foreground" = "#ffff55"
"editorInfo.foreground" = "#55ffff"
"gitDecoration.modifiedResourceForeground" = "#ffff55"
"gitDecoration.addedResourceForeground" = "#55ff55"
"gitDecoration.deletedResourceForeground" = "#ff6b6b"
"yace.dirtyForeground" = "#ffff55"
"yace.missingRootForeground" = "#ff6b6b"
"scrollbarSlider.background" = "#00aaaa"
"editorWhitespace.foreground" = "#5555ff"
"editor.findMatchHighlightBackground" = "#aa00aa"
"editor.findMatchBackground" = "#aa0000"
"editorSuggestWidget.highlightForeground" = "#0000aa"
"terminal.background" = "#000000"
"terminal.foreground" = "#aaaaaa"
"terminal.ansiBlack" = "#000000"
"terminal.ansiRed" = "#ff5555"
"terminal.ansiGreen" = "#00aa00"
"terminal.ansiYellow" = "#aa5500"
"terminal.ansiBlue" = "#5555ff"
"terminal.ansiMagenta" = "#aa00aa"
"terminal.ansiCyan" = "#00aaaa"
"terminal.ansiWhite" = "#aaaaaa"
"terminal.ansiBrightBlack" = "#555555"
"terminal.ansiBrightRed" = "#ff5555"
"terminal.ansiBrightGreen" = "#55ff55"
"terminal.ansiBrightYellow" = "#ffff55"
"terminal.ansiBrightBlue" = "#5555ff"
"terminal.ansiBrightMagenta" = "#ff55ff"
"terminal.ansiBrightCyan" = "#55ffff"
"terminal.ansiBrightWhite" = "#ffffff"

[syntax]
"none" = "#ffff55"
"comment" = "#aaaaaa"
"string" = "#55ffff"
"string.special" = "#55ffff"
"string.escape" = "#ff55ff"
"character" = "#55ffff"
"number" = "#55ff55"
"boolean" = "#55ff55"
"constant" = "#55ff55"
"constant.builtin" = "#55ff55"
"keyword" = { fg = "#ffffff", bold = true }
"keyword.control" = { fg = "#ffffff", bold = true }
"operator" = "#ffffff"
"punctuation" = "#ffff55"
"punctuation.bracket" = "#ffffff"
"function" = "#ffffff"
"function.builtin" = "#ffffff"
"function.method" = "#ffffff"
"function.macro" = "#ff55ff"
"type" = "#55ffff"
"type.builtin" = { fg = "#55ffff", bold = true }
"constructor" = "#55ffff"
"variable" = "#ffff55"
"variable.builtin" = { fg = "#ffffff", bold = true }
"variable.parameter" = "#ffff55"
"property" = "#ffff55"
"attribute" = "#ff55ff"
"tag" = "#ffffff"
"namespace" = "#55ffff"
"label" = "#ff55ff"
"markup.heading" = { fg = "#ffffff", bold = true }
"markup.bold" = { fg = "#ffff55", bold = true }
"markup.italic" = { fg = "#ffff55", italic = true }
"markup.link" = { fg = "#55ffff", underline = true }
"markup.raw" = "#55ff55"
"markup.list" = "#ffffff"
"embedded" = "#ffff55"
