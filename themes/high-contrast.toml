# High Contrast: black and white with bright accents. Every text colour is
# at least 7:1 against the background it's drawn on (WCAG AAA).
name = "High Contrast"
type = "dark"

[colors]
"editor.background" = "#000000"
"editor.foreground" = "#ffffff"
"descriptionForeground" = "#d0d0d0"
"sideBar.background" = "#000000"
"sideBar.foreground" = "#ffffff"
"sideBarTitle.foreground" = "#ffffff"
"tab.activeBackground" = "#0b3d7a"
"tab.activeForeground" = "#ffffff"
"tab.inactiveBackground" = "#000000"
"tab.inactiveForeground" = "#d0d0d0"
"editorGroupHeader.tabsBackground" = "#000000"
"editorGroup.border" = "#6fc3df"
"focusBorder" = "#f38518"
"editor.selectionBackground" = "#0b3d7a"
"editor.inactiveSelectionBackground" = "#262626"
"editor.lineHighlightBackground" = "#1c1c1c"
"editorLineNumber.foreground" = "#c0c0c0"
"editorLineNumber.activeForeground" = "#ffffff"
"editorCursor.background" = "#000000"
"editorCursor.foreground" = "#ffffff"
"editorBracketMatch.background" = "#0b3d7a"
"statusBar.background" = "#000000"
"statusBar.foreground" = "#ffffff"
"statusBar.noFolderBackground" = "#000000"
"list.activeSelectionBackground" = "#0b3d7a"
"list.activeSelectionForeground" = "#ffffff"
"list.inactiveSelectionBackground" = "#262626"
"list.highlightForeground" = "#ffd75f"
"editorWidget.background" = "#000000"
"editorWidget.foreground" = "#ffffff"
"editorWidget.border" = "#6fc3df"
"quickInputList.focusBackground" = "#0b3d7a"
"input.background" = "#000000"
"editorError.foreground" = "#ff6b6b"
"editorWarning.foreground" = "#ffd75f"
"editorInfo.foreground" = "#75beff"
"gitDecoration.modifiedResourceForeground" = "#ffd75f"
"gitDecoration.addedResourceForeground" = "#7ee787"
"gitDecoration.deletedResourceForeground" = "#ff6b6b"
"yace.dirtyForeground" = "#ffd75f"
"yace.missingRootForeground" = "#ff6b6b"
"scrollbarSlider.background" = "#6f6f6f"
"editorWhitespace.foreground" = "#5a5a5a"
"editor.findMatchHighlightBackground" = "#4d3b00"
"editor.findMatchBackground" = "#7a5a00"
"editorSuggestWidget.highlightForeground" = "#ffd75f"
"terminal.background" = "#000000"
"terminal.foreground" = "#ffffff"
"terminal.ansiBlack" = "#000000"
"terminal.ansiRed" = "#ff6b6b"
"terminal.ansiGreen" = "#7ee787"
"terminal.ansiYellow" = "#ffd75f"
"terminal.ansiBlue" = "#75beff"
"terminal.ansiMagenta" = "#ff9cf5"
"terminal.ansiCyan" = "#6fe7ef"
"terminal.ansiWhite" = "#e5e5e5"
"terminal.ansiBrightBlack" = "#a0a0a0"
"terminal.ansiBrightRed" = "#ff8f8f"
"terminal.ansiBrightGreen" = "#a6f5a9"
"terminal.ansiBrightYellow" = "#ffe88f"
"terminal.ansiBrightBlue" = "#a3d4ff"
"terminal.ansiBrightMagenta" = "#ffbff9"
"terminal.ansiBrightCyan" = "#9ff3f8"
"terminal.ansiBrightWhite" = "#ffffff"

[syntax]
"none" = "#ffffff"
"comment" = { fg = "#9fd18b", italic = true }
"string" = "#ffb38f"
"string.special" = "#ffb38f"
"string.escape" = "#ffd75f"
"character" = "#ffb38f"
"number" = "#c8f0a8"
"boolean" = "#75beff"
"constant" = "#6fe7ef"
"constant.builtin" = "#75beff"
"keyword" = { fg = "#75beff", bold = true }
"keyword.control" = { fg = "#ff9cf5", bold = true }
"operator" = "#ffffff"
"punctuation" = "#ffffff"
"punctuation.bracket" = "#ffffff"
"function" = "#ffe88f"
"function.builtin" = "#ffe88f"
"function.method" = "#ffe88f"
"function.macro" = "#6fe7ef"
"type" = "#6fe7ef"
"type.builtin" = "#6fe7ef"
"constructor" = "#6fe7ef"
"variable" = "#b8e2ff"
"variable.builtin" = "#75beff"
"variable.parameter" = "#b8e2ff"
"property" = "#b8e2ff"
"attribute" = "#b8e2ff"
"tag" = "#75beff"
"namespace" = "#6fe7ef"
"label" = "#ffffff"
"markup.heading" = { fg = "#75beff", bold = true }
"markup.bold" = { fg = "#ffffff", bold = true }
"markup.italic" = { fg = "#ffffff", italic = true }
"markup.link" = { fg = "#75beff", underline = true }
"markup.raw" = "#ffb38f"
"markup.list" = "#75beff"
"embedded" = "#ffffff"
